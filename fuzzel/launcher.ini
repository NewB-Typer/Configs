[main]
font = AdwaitaMono :style=Regular:size=14
width = 30
lines = 10
horizontal-pad = 20
vertical-pad = 30
inner-pad = 30
prompt = ""
terminal = alacritty
icon-theme = "Papirus-Dark"
dpi-aware = yes
layer = overlay
anchor = center
exit-on-keyboard-focus-loss = no

[colors]
background = 000000dd
text = ffffffff
match = ffffff99
selection = ffffff22
selection-text = ffffffff
border = ffffff80
